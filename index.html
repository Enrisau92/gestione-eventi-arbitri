<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestione Eventi Arbitri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">Commissione Arbitri</div>
      <h1>Gestione Eventi</h1>
    </div>
    <button class="primary" id="newEventBtn">+ Nuovo evento</button>
  </header>

  <main class="container">
    <section class="toolbar">
      <input id="eventSearch" type="search" placeholder="Cerca evento, tipologia o luogo…">
      <select id="statusFilter">
        <option value="all">Tutti gli stati</option>
        <option value="complete">Completi</option>
        <option value="partial">Da completare</option>
        <option value="none">Nessun designato</option>
      </select>
    </section>

    <section id="eventsList" class="events"></section>
  </main>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Nuovo evento</h2>
        <button class="icon" id="closeModalBtn" aria-label="Chiudi">×</button>
      </div>

      <form id="eventForm">
        <input type="hidden" id="eventId">
        <div class="grid2">
          <label>Data<input id="eventDate" type="date" required></label>
          <label>Ora inizio<input id="eventStartTime" type="time" required></label>
          <label>Ora fine<input id="eventEndTime" type="time" required></label>
          <label>Tipologia
            <select id="eventType" required>
              <option value="Torneo non ufficiale">Torneo non ufficiale</option>
              <option value="Allenamento congiunto">Allenamento congiunto</option>
              <option value="Amichevole">Amichevole</option>
              <option value="Altro">Altro</option>
            </select>
          </label>
          <label>Arbitri richiesti<input id="eventRequired" type="number" min="1" value="2" required></label>
        </div>
        <label>Evento / squadre<input id="eventName" type="text" placeholder="Es. Torneo XYZ" required></label>
        <label>Luogo<input id="eventPlace" type="text" placeholder="Es. Ravenna"></label>
        <label>Note<textarea id="eventNotes" rows="2" placeholder="Eventuali informazioni utili"></textarea></label>
        <div class="form-actions">
          <button type="button" class="ghost" id="cancelBtn">Annulla</button>
          <button type="submit" class="primary">Salva evento</button>
        </div>
      </form>
    </div>
  </div>

  <div id="detailModal" class="modal hidden">
    <div class="modal-card large">
      <div class="modal-head">
        <div>
          <div class="eyebrow" id="detailType"></div>
          <h2 id="detailTitle"></h2>
          <div class="muted" id="detailMeta"></div>
        </div>
        <button class="icon" id="closeDetailBtn" aria-label="Chiudi">×</button>
      </div>

      <div class="detail-summary">
        <div><strong id="detailRequired">0</strong><span>richiesti</span></div>
        <div class="detail-availability">
          <strong id="detailAvailable">0</strong><span>disponibili</span>
          <div class="coverage-bar"><div id="detailCoverageFill" class="coverage-fill"></div></div>
          <small id="detailCoverageLabel"></small>
        </div>
        <div><strong id="detailAssigned">0</strong><span>designati</span></div>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="availability">Disponibilità <span id="availabilityTabCount">0</span></button>
        <button class="tab" data-tab="assignments">Designazioni <span id="assignmentTabCount">0</span></button>
      </div>

      <section id="availabilityView" class="tab-view">
        <div class="section-title">Seleziona gli arbitri disponibili</div>
        <div class="search-row">
          <input id="arbiterSearch" type="search" placeholder="🔍 Cerca nome o cognome…">
          <button class="ghost" id="clearAvailabilityBtn">Azzera selezioni</button>
        </div>
        <div class="manual-row">
          <input id="manualArbiterName" type="text" placeholder="Nome e cognome non presenti nell'elenco…">
          <button class="ghost" id="addManualArbiterBtn">+ Aggiungi nome</button>
        </div>
        <div class="hint-block">Cerca un arbitro e premi <strong>Aggiungi</strong>. Se non è nell'elenco, puoi inserirlo manualmente.</div>
        <div id="arbiterResults" class="arbiter-list"></div>
      </section>

      <section id="assignmentsView" class="tab-view hidden">
        <div class="section-title">Scegli i designati <span class="hint">Solo tra gli arbitri disponibili</span></div>
        <div class="search-row">
          <input id="assignmentSearch" type="search" placeholder="🔍 Cerca tra i disponibili…">
        </div>
        <div id="assignedList" class="assigned-list"></div>
      </section>

      <div class="form-actions">
        <button type="button" class="danger ghost" id="deleteEventBtn">Elimina evento</button>
        <button type="button" class="primary" id="saveDetailBtn">Salva disponibilità e designazioni</button>
      </div>
    </div>
  </div>

  <script src="arbitri.js"></script>
  <script src="app.js"></script>
</body>
</html>
